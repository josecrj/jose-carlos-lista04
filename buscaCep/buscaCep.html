<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Busca de CEP</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 800px; }
    input, select, button { padding: 8px; margin: 5px 0; }
    select { max-width: 100%; }
    .erro { color: red; }
    .postagem { border: 1px solid #ccc; padding: 12px; margin-top: 12px; }
    .titulo { width: 100%; text-align: left; cursor: pointer; }
    .comentario { border-top: 1px solid #ddd; padding-top: 8px; }
  </style>
</head>
<body>
  <h1>Busca de CEP</h1>
  <form id="formulario">
    <label for="cep">CEP:</label>
    <input id="cep" type="text" inputmode="numeric" placeholder="79002-000">
    <button type="submit">Buscar</button>
  </form>
  <div id="resultado" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
